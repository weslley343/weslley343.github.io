<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs // weslley343</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/common/global.css">
    <link rel="stylesheet" href="css/index/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .log-hero-banner {
            position: relative;
            width: 100vw;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            min-height: 340px;
            display: flex;
            align-items: center;
            border-radius: 0;
            border-left: none;
            border-right: none;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, rgba(13, 15, 18, 0.72) 0%, rgba(13, 15, 18, 0.90) 100%),
                url('assets/20210711_163112_min.jpg') center/cover no-repeat;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .log-hero-content {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
            width: 100%;
        }

        @media (min-width: 768px) {
            .log-hero-content {
                padding: 0 var(--spacing-lg);
            }
        }

        .log-feed {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            max-width: 600px;
            margin: 0 auto;
        }

        .log-entry {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: var(--spacing-md);
            font-family: var(--font-body);
            color: var(--text-primary);
        }

        .log-entry p {
            margin-bottom: var(--spacing-sm);
        }

        .log-entry p:last-child {
            margin-bottom: 0;
        }

        .log-entry ul,
        .log-entry ol {
            margin-bottom: var(--spacing-sm);
            padding-left: var(--spacing-lg);
        }

        .log-entry code {
            font-family: var(--font-mono);
            background-color: var(--background-color);
            padding: 0.1rem 0.3rem;
            border-radius: 2px;
            font-size: 0.9em;
        }

        .log-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: var(--spacing-sm);
            padding-top: var(--spacing-sm);
            border-top: 1px solid var(--background-color);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <a href="index.html" style="text-decoration: none; color: inherit;">WD343</a>
            </div>
            <nav class="navbar-links">
                <a href="index.html">/INÍCIO</a>
                <a href="blog.html">/BLOG</a>
                <a href="logs.html" class="active">/LOGS</a>
                <a href="me.html">/SOBRE</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero log-hero-banner">
            <div class="log-hero-content">
                <h1 class="page-title">
                    <span style="color: #7dd3fc;">LOGS</span><span style="color: var(--info-blue); opacity: 0.8;">_</span><br>
                    <span style="color: #0284c7;">DO_SISTEMA</span>
                </h1>
                <p class="subtitle">Atualizações de status em tempo real e notas rápidas de desenvolvimento.</p>
            </div>
        </section>

        <hr class="divider">

        <section class="grid-section">
            <div id="log-feed" class="log-feed">
                <p style="color: var(--text-secondary); font-family: var(--font-mono); text-align: center;">[ LOG DO
                    SISTEMA ] Carregando registros do terminal...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <span class="mono-label">DIREITOS AUTORAIS &copy; 2026</span>
                <span class="mono-label">INICIATIVA: WESLLEY343</span>
            </div>
        </div>
    </footer>

    <script src="js/blog.js"></script>
</body>

</html>
