<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs // weslley343</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common/global.css">
    <link rel="stylesheet" href="css/index/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .log-feed {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            max-width: 600px;
            margin: 0 auto;
        }
        .log-entry {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: var(--spacing-md);
            font-family: var(--font-body);
            color: var(--text-primary);
        }
        .log-entry p {
            margin-bottom: var(--spacing-sm);
        }
        .log-entry p:last-child {
            margin-bottom: 0;
        }
        .log-entry ul, .log-entry ol {
            margin-bottom: var(--spacing-sm);
            padding-left: var(--spacing-lg);
        }
        .log-entry code {
            font-family: var(--font-mono);
            background-color: var(--background-color);
            padding: 0.1rem 0.3rem;
            border-radius: 2px;
            font-size: 0.9em;
        }
        .log-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: var(--spacing-sm);
            padding-top: var(--spacing-sm);
            border-top: 1px solid var(--background-color);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                W343
            </div>
            <nav class="navbar-links">
                <a href="index.html">/INDEX</a>
                <a href="articles.html">/ARTICLES</a>
                <a href="logs.html" class="active">/LOGS</a>
                <a href="galley.html">/GALERRY</a>
                <a href="me.html">/ME</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero" style="text-align: center; max-width: 600px; margin: 0 auto;">
            <div class="metadata-block">
                <span class="mono-label">MODULE</span> LOGS <br>
                <span class="mono-label">SOURCE</span> OBSIDIAN_VAULT
            </div>
            <h1 class="page-title" style="font-size: 2.5rem;">
                <span style="color: #7dd3fc;">SYSTEM</span><span style="color: var(--info-blue); opacity: 0.8;">_</span><span style="color: #0284c7;">LOGS</span>
            </h1>
            <p class="subtitle">Real-time status updates, micro-thoughts, and quick development notes.</p>
        </section>

        <hr class="divider" style="max-width: 600px; margin: var(--spacing-xl) auto;">

        <section class="grid-section" style="max-width: 600px; margin: 0 auto;">
            <div id="log-feed" class="log-feed">
                <p style="color: var(--text-secondary); font-family: var(--font-mono); text-align: center;">[ SYSTEM_LOG ] Fetching terminal logs...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <span class="mono-label">COPYRIGHT &copy; 2026</span>
                <span class="mono-label">INITIATIVE: WESLLEY343</span>
            </div>
        </div>
    </footer>

    <script src="js/blog.js"></script>
</body>
</html>
