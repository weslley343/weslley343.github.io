<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article // weslley343</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common/global.css">
    <link rel="stylesheet" href="css/index/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .article-body {
            font-family: var(--font-body);
            line-height: 1.8;
            font-size: 1.125rem;
            color: var(--text-primary);
            max-width: 760px;
            margin: 0 auto;
            padding: var(--spacing-xl) 0;
        }
        .article-body h1, .article-body h2, .article-body h3 {
            margin-top: var(--spacing-xl);
            margin-bottom: var(--spacing-md);
            color: #ffffff;
            font-family: var(--font-heading);
            text-transform: uppercase;
        }
        .article-body p {
            margin-bottom: var(--spacing-lg);
        }
        .article-body code {
            font-family: var(--font-mono);
            background-color: var(--surface-color);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .article-body pre code {
            display: block;
            padding: var(--spacing-md);
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }
        .article-body a {
            color: var(--info-blue);
            text-decoration: underline;
        }
        .article-body blockquote {
            border-left: 4px solid var(--info-blue);
            padding-left: var(--spacing-md);
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: var(--spacing-lg);
        }
        .article-body img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            margin-bottom: var(--spacing-md);
        }
        .article-header {
            text-align: center;
            padding: var(--spacing-xl) 0 var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--spacing-xl);
            max-width: 760px;
            margin: 0 auto var(--spacing-xl);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                W343
            </div>
            <nav class="navbar-links">
                <a href="index.html">/INDEX</a>
                <a href="articles.html" class="active">/ARTICLES</a>
                <a href="logs.html">/LOGS</a>
                <a href="galley.html">/GALERRY</a>
                <a href="me.html">/ME</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="article-header">
            <h1 id="article-title" class="page-title">Loading...</h1>
            <div id="article-meta" style="margin-top: var(--spacing-md); color: var(--text-secondary);">
                <!-- Meta injected by JS -->
            </div>
        </div>
        
        <div id="article-content" class="article-body">
            <p>Carregando conteúdo...</p>
        </div>
        
        <div style="text-align: center; margin: var(--spacing-xl) 0;">
            <a href="articles.html" class="tech-link">&lt;- VOLTAR PARA ARTICLES</a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <span class="mono-label">COPYRIGHT &copy; 2026</span>
                <span class="mono-label">INITIATIVE: WESLLEY343</span>
            </div>
        </div>
    </footer>

    <script src="js/blog.js"></script>
</body>
</html>
