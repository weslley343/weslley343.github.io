<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog // weslley343</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/common/global.css">
    <link rel="stylesheet" href="css/index/styles.css">
    <style>
        .blog-hero-banner {
            position: relative;
            width: 100vw;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            min-height: 340px;
            display: flex;
            align-items: center;
            border-radius: 0;
            border-left: none;
            border-right: none;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, rgba(13, 15, 18, 0.72) 0%, rgba(13, 15, 18, 0.90) 100%),
                url('assets/IMG_6301.JPG') center/cover no-repeat;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .blog-hero-content {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
            width: 100%;
        }

        @media (min-width: 768px) {
            .blog-hero-content {
                padding: 0 var(--spacing-lg);
            }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <a href="index.html" style="text-decoration: none; color: inherit;">WD343</a>
            </div>
            <nav class="navbar-links">
                <a href="index.html">/INÍCIO</a>
                <a href="blog.html" class="active">/BLOG</a>
                <a href="logs.html">/LOGS</a>
                <a href="me.html">/SOBRE</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero blog-hero-banner">
            <div class="blog-hero-content">
                <h1 class="page-title">
                    <span style="color: #0073a8;">HUMANOS&amp;</span><br>
                    <span style="color: #7cd3ff;">MÁQUINAS.</span>
                </h1>
                <p class="subtitle">
                    Este espaço funciona como uma espécie de diário de bordo, os textos são gerados com base em
                    pesquisas
                    manuais e escritos de maneira orgânica.
                </p>
            </div>
        </section>

        <hr class="divider">

        <section class="grid-section">
            <div id="posts">
                <p style="color: var(--text-secondary); font-family: var(--font-mono);">[ LOG DO SISTEMA ] Carregando
                    registros do cofre...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <span class="mono-label">DIREITOS AUTORAIS &copy; 2026</span>
                <span class="mono-label">INICIATIVA: WESLLEY343</span>
            </div>
        </div>
    </footer>

    <script src="js/blog.js"></script>
</body>

</html>
